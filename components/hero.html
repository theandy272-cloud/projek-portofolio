<!-- ============================================================
     Reusable component: Hero section
     Standalone markup partial — kept in sync with index.html.
     Features: availability badge, typewriter intro, profile card,
     CTA buttons, floating chips.
     ============================================================ -->
<section class="hero" id="hero">
    <div class="container hero__inner">
        <div class="hero__content reveal">
            <span class="badge">
                <span class="badge__dot"></span>
                Available for opportunities
            </span>

            <h1 class="hero__title">
                Halo, saya <span class="gradient-text">Andi Wahyudi</span>
            </h1>

            <h2 class="hero__typed">
                <span class="hero__typed-prefix">Saya seorang </span>
                <span class="typewriter" id="typewriter"></span>
                <span class="caret">|</span>
            </h2>

            <p class="hero__tagline">"Matematika Untuk Indonesia."</p>

            <p class="hero__desc">
                Pendidik matematika yang berbasis di Cirebon, Indonesia.
            </p>

            <div class="hero__actions">
                <a href="#projects" class="btn btn--primary">Lihat Project</a>
                <a href="assets/andi-wahyudi-resume.pdf" class="btn btn--ghost" download>Download Resume</a>
            </div>
        </div>

        <div class="hero__visual reveal">
            <div class="profile-card float">
                <div class="profile-card__glow"></div>
                <div class="profile-card__photo"><span class="profile-card__initials">AW</span></div>
                <div class="profile-card__info">
                    <h3>Andi Wahyudi</h3>
                    <p>Math Teacher</p>
                    <span class="profile-card__loc">Cirebon, Indonesia</span>
                </div>
            </div>
        </div>
    </div>
</section>
